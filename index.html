<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎂 Happy Birthday!</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0010;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Quicksand', sans-serif;
    overflow: hidden;
    user-select: none;
  }

  canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  /* ── CHAOS ── */
  #chaos { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1; overflow:hidden; }
  .frog { position:absolute; font-size:2rem; bottom:-60px; animation: frogJump 1.8s ease-in-out infinite; }
  @keyframes frogJump { 0%,100%{transform:translateY(0)} 20%{transform:translateY(-80px)} 40%{transform:translateY(0)} 60%{transform:translateY(-50px)} 80%{transform:translateY(0)} }
  .star-fall { position:absolute; font-size:1.2rem; top:-40px; animation: starFall linear infinite; }
  @keyframes starFall { 0%{transform:translateY(0) rotate(0deg);opacity:1} 100%{transform:translateY(110vh) rotate(720deg);opacity:0} }

  /* ── FIGHTERS ── */
  .fighter-wrap { position:fixed; bottom:20px; left:0; width:100%; display:flex; justify-content:space-between; padding:0 60px; pointer-events:none; z-index:2; }
  .fighter { font-size:3rem; display:flex; flex-direction:column; align-items:center; }
  .fighter .hp { font-size:0.6rem; font-family:'Quicksand',sans-serif; color:#ff6ec7; font-weight:700; margin-bottom:2px; }
  .fighter .fname { font-size:0.55rem; font-family:'Quicksand',sans-serif; color:rgba(255,200,255,0.7); margin-top:2px; }
  .fighter-left  { animation: fLeft  0.5s ease-in-out infinite alternate; }
  .fighter-right { animation: fRight 0.5s ease-in-out infinite alternate; transform:scaleX(-1); }
  @keyframes fLeft  { from{transform:scaleX(1) translateY(0)} to{transform:scaleX(1) translateY(-8px) rotate(-5deg)} }
  @keyframes fRight { from{transform:scaleX(-1) translateY(0)} to{transform:scaleX(-1) translateY(-8px) rotate(5deg)} }
  .hit-text { position:fixed; pointer-events:none; z-index:3; font-family:'Quicksand',sans-serif; font-weight:700; font-size:1.4rem; color:#ffe566; text-shadow:0 0 10px rgba(255,229,102,0.8); animation:hitPop 0.8s ease forwards; }
  @keyframes hitPop { 0%{opacity:1;transform:scale(0.5) rotate(-10deg)} 40%{opacity:1;transform:scale(1.3) rotate(5deg)} 100%{opacity:0;transform:scale(1) translateY(-40px)} }

  /* ── INTRO ── */
  #intro {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    animation: fadeIn 1s ease;
  }
  #intro .envelope {
    font-size: 100px;
    animation: float 3s ease-in-out infinite, pulse 2s ease-in-out infinite;
    filter: drop-shadow(0 0 30px rgba(255,180,50,0.6));
  }
  #intro p {
    color: #f0d0ff;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 2px;
    opacity: 0.8;
    animation: blink 1.5s ease-in-out infinite;
  }
  #tap-btn {
    background: linear-gradient(135deg, #ff6ec7, #ffb347, #ff6ec7);
    background-size: 200% 200%;
    animation: gradMove 2s ease infinite;
    border: none;
    border-radius: 50px;
    padding: 16px 48px;
    font-family: 'Quicksand', sans-serif;
    font-size: 1.2rem;
    font-weight: 700;
    color: white;
    cursor: pointer;
    letter-spacing: 1px;
    box-shadow: 0 0 30px rgba(255,110,200,0.5);
    transition: transform 0.1s;
  }
  #tap-btn:hover { transform: scale(1.07); }
  #tap-btn:active { transform: scale(0.96); }

  /* ── BIRTHDAY SCREEN ── */
  #birthday {
    position: relative;
    z-index: 10;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 0;
    animation: revealCard 0.8s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }

  .hb-title {
    font-family: 'Pacifico', cursive;
    font-size: clamp(2.2rem, 8vw, 4.5rem);
    background: linear-gradient(90deg, #ff6ec7, #ffb347, #ffe566, #6ef7ff, #b47fff);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 3s linear infinite;
    text-align: center;
    line-height: 1.2;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 20px rgba(255,110,200,0.4));
  }
  .hb-sub {
    color: #f0c8ff;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 28px;
    opacity: 0.85;
    text-align: center;
  }

  /* ── CAKE ── */
  .cake-wrap {
    position: relative;
    width: 220px;
    margin-bottom: 4px;
    cursor: pointer;
  }
  svg.cake-svg {
    width: 100%;
    height: auto;
    filter: drop-shadow(0 10px 40px rgba(255,110,200,0.45));
    overflow: visible;
    transition: transform 0.2s;
  }
  .cake-wrap:hover svg.cake-svg { transform: scale(1.04); }
  .cake-wrap:active svg.cake-svg { transform: scale(0.97); }

  .cake-hint {
    text-align: center;
    color: rgba(255,200,255,0.6);
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 1px;
    margin-bottom: 16px;
    animation: blink 2s ease-in-out infinite;
  }

  .flame {
    transform-origin: center bottom;
    animation: flicker 0.3s ease-in-out infinite alternate;
  }
  .flame:nth-child(2) { animation-delay: 0.1s; }
  .flame:nth-child(3) { animation-delay: 0.2s; }
  .flame:nth-child(4) { animation-delay: 0.15s; }
  .flame:nth-child(5) { animation-delay: 0.05s; }

  .glow-ring {
    position: absolute;
    top: 30px; left: 50%;
    transform: translateX(-50%);
    width: 160px; height: 40px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,220,80,0.35) 0%, transparent 70%);
    animation: glowPulse 1.5s ease-in-out infinite alternate;
    pointer-events: none;
  }

  /* ── PHOTO POPUP ── */
  #photo-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    align-items: center;
    justify-content: center;
    background: rgba(10,0,20,0.78);
    backdrop-filter: blur(8px);
  }
  #photo-overlay.show {
    display: flex;
    animation: fadeIn 0.3s ease;
  }

  .photo-popup {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1);
    padding: 0 20px;
  }

  .photo-frame {
    position: relative;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    padding: 5px;
    background: linear-gradient(135deg, #ff6ec7, #ffb347, #ffe566, #6ef7ff, #b47fff, #ff6ec7);
    background-size: 300% 300%;
    animation: gradMove 2.5s linear infinite;
    box-shadow:
      0 0 30px rgba(255,110,200,0.7),
      0 0 60px rgba(180,100,255,0.35),
      0 0 90px rgba(255,110,200,0.15);
  }
  .photo-frame img {
    transition: opacity 0.15s ease;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #0a0010;
    display: block;
  }
  .photo-frame::before, .photo-frame::after {
    content: '✨';
    position: absolute;
    font-size: 1.6rem;
    animation: sparkleFloat 2s ease-in-out infinite alternate;
  }
  .photo-frame::before { top: -10px; left: -6px; }
  .photo-frame::after  { bottom: -10px; right: -6px; animation-delay: 0.6s; }

  .photo-name {
    font-family: 'Pacifico', cursive;
    font-size: 1.7rem;
    background: linear-gradient(90deg, #ff6ec7, #ffb347, #ffe566);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-align: center;
    filter: drop-shadow(0 0 10px rgba(255,180,50,0.5));
  }
  .photo-msg {
    color: #f0d0ff;
    font-size: 0.95rem;
    font-weight: 600;
    text-align: center;
    max-width: 280px;
    line-height: 1.7;
    opacity: 0.9;
  }
  .close-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 30px;
    padding: 10px 32px;
    color: rgba(255,200,255,0.8);
    font-family: 'Quicksand', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s;
    margin-top: 4px;
  }
  .close-btn:hover { background: rgba(255,110,200,0.2); border-color: #ff6ec7; color: #ff6ec7; }

  /* ── MSG CARD ── */
  .msg-card {
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 18px 28px;
    text-align: center;
    max-width: 320px;
    animation: slideUp 0.6s 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  .msg-card p { color: #f5e0ff; font-size: 1rem; font-weight: 600; line-height: 1.7; }
  .emoji-row {
    font-size: 1.6rem;
    margin-top: 8px;
    letter-spacing: 4px;
    animation: bounce 1s ease-in-out infinite alternate;
  }

  #restart {
    margin-top: 20px;
    background: transparent;
    border: 2px solid rgba(255,180,255,0.4);
    border-radius: 30px;
    padding: 10px 32px;
    color: rgba(255,200,255,0.7);
    font-family: 'Quicksand', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s;
    animation: slideUp 0.6s 0.8s both;
  }
  #restart:hover { border-color: #ff6ec7; color: #ff6ec7; }

  /* ── KEYFRAMES ── */
  @keyframes fadeIn    { from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)} }
  @keyframes float     { 0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)} }
  @keyframes pulse     { 0%,100%{filter:drop-shadow(0 0 20px rgba(255,180,50,0.4))}50%{filter:drop-shadow(0 0 40px rgba(255,180,50,0.9))} }
  @keyframes blink     { 0%,100%{opacity:0.45}50%{opacity:1} }
  @keyframes gradMove  { 0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%} }
  @keyframes shimmer   { 0%{background-position:0% 50%}100%{background-position:300% 50%} }
  @keyframes flicker   { 0%{transform:scaleX(1) scaleY(1) rotate(-2deg);opacity:1}100%{transform:scaleX(0.85) scaleY(1.1) rotate(2deg);opacity:0.85} }
  @keyframes glowPulse { from{opacity:0.6;transform:translateX(-50%) scaleX(0.9)}to{opacity:1;transform:translateX(-50%) scaleX(1.1)} }
  @keyframes revealCard{ from{opacity:0;transform:scale(0.7) translateY(40px)}to{opacity:1;transform:scale(1) translateY(0)} }
  @keyframes slideUp   { from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)} }
  @keyframes bounce    { from{transform:translateY(0)}to{transform:translateY(-6px)} }
  @keyframes popIn     { from{opacity:0;transform:scale(0.4) translateY(50px)}to{opacity:1;transform:scale(1) translateY(0)} }
  @keyframes sparkleFloat { from{transform:scale(1) rotate(-10deg)}to{transform:scale(1.4) rotate(10deg)} }

  .carousel-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
}
.car-btn {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 50%;
  width: 40px; height: 40px;
  font-size: 1.6rem;
  color: white;
  cursor: pointer;
  transition: background 0.2s;
  line-height: 1;
  display: flex; align-items: center; justify-content: center;
}
.car-btn:hover { background: rgba(255,110,200,0.35); border-color: #ff6ec7; }
.car-dots {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-top: -8px;
}
.car-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,0.25);
  cursor: pointer;
  transition: background 0.2s, transform 0.2s;
}
.car-dot.active { background: #ff6ec7; transform: scale(1.3); }

</style>
</head>

<script>
// Fireworks
const canvas = document.getElementById('fireworks');
const ctx = canvas.getContext('2d');
let W, H, particles = [], active = false;
function resize(){ W=canvas.width=innerWidth; H=canvas.height=innerHeight; }
resize(); window.addEventListener('resize', resize);

class Particle {
  constructor(x,y,color){
    this.x=x; this.y=y;
    const a=Math.random()*Math.PI*2, s=2+Math.random()*6;
    this.vx=Math.cos(a)*s; this.vy=Math.sin(a)*s;
    this.alpha=1; this.color=color; this.size=2+Math.random()*3;
    this.decay=0.012+Math.random()*0.01;
  }
  update(){ this.x+=this.vx; this.y+=this.vy; this.vy+=0.08; this.vx*=0.98; this.alpha-=this.decay; }
  draw(){
    ctx.save(); ctx.globalAlpha=Math.max(0,this.alpha);
    ctx.fillStyle=this.color; ctx.shadowBlur=6; ctx.shadowColor=this.color;
    ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill(); ctx.restore();
  }
}
const COLORS=['#ff6ec7','#ffb347','#ffe566','#6ef7ff','#b47fff','#ff7675','#fdcb6e','#00cec9','#fd79a8','#a29bfe'];
function burst(x,y){
  const c=COLORS[Math.floor(Math.random()*COLORS.length)];
  for(let i=0;i<80;i++) particles.push(new Particle(x,y,c));
}
function launchRandom(){
  if(!active) return;
  burst(80+Math.random()*(W-160), 60+Math.random()*(H*.55));
  setTimeout(launchRandom, 400+Math.random()*600);
}
(function loop(){
  requestAnimationFrame(loop);
  if(!active){ ctx.clearRect(0,0,W,H); return; }
  ctx.fillStyle='rgba(10,0,16,0.18)'; ctx.fillRect(0,0,W,H);
  particles=particles.filter(p=>p.alpha>0);
  particles.forEach(p=>{ p.update(); p.draw(); });
})();

// ── CHAOS: FROGS ──
const chaos = document.getElementById('chaos');
let chaosIntervals=[], frogIntervals=[], fightInterval;
function spawnFrog(){
  const el=document.createElement('div'); el.className='frog';
  el.textContent=['🐸','🐸','🐸'][Math.floor(Math.random()*4)];
  el.style.left=(Math.random()*90)+'%';
  const dur=1.5+Math.random()*2; el.style.animationDuration=dur+'s';
  chaos.appendChild(el);
  let posX=parseFloat(el.style.left), hop=0;
  const dir=Math.random()>0.5?1:-1, speed=0.3+Math.random()*0.5;
  const mv=setInterval(()=>{
    posX+=dir*speed; if(posX<0)posX=0; if(posX>95)posX=95;
    el.style.left=posX+'%'; el.style.transform=dir<0?'scaleX(-1)':'scaleX(1)';
    if(++hop>120){clearInterval(mv);el.remove();}
  },50); frogIntervals.push(mv);
}
function spawnStar(){
  const el=document.createElement('div'); el.className='star-fall';
  el.textContent=['⭐','🌟','✨','💫','⚡','🌠'][Math.floor(Math.random()*6)];
  el.style.left=(Math.random()*100)+'%';
  const dur=2+Math.random()*4; el.style.animationDuration=dur+'s';
  el.style.fontSize=(0.8+Math.random()*1.5)+'rem';
  chaos.appendChild(el); setTimeout(()=>el.remove(),dur*1000+500);
}
// ── FIGHTERS ──
const hitWords=['Cihuy','Cukurukuk','Wukwuk','Wukwuk'];
let hpL=3,hpR=3;
function makeHp(n){return'❤️'.repeat(Math.max(0,n));}
function spawnHit(side){
  const el=document.createElement('div'); el.className='hit-text';
  el.textContent=hitWords[Math.floor(Math.random()*hitWords.length)];
  el.style.left=side==='left'?'15%':'65%';
  el.style.bottom=(80+Math.random()*60)+'px';
  el.style.color=['#ff6ec7','#ffe566','#6ef7ff','#ffb347'][Math.floor(Math.random()*4)];
  document.body.appendChild(el); setTimeout(()=>el.remove(),900);
}
function startFight(){
  document.getElementById('fighters').style.display='flex';
  hpL=3;hpR=3;
  document.getElementById('hp-left').textContent=makeHp(hpL);
  document.getElementById('hp-right').textContent=makeHp(hpR);
  fightInterval=setInterval(()=>{
    if(!active){clearInterval(fightInterval);return;}
    const att=Math.random()>0.5?'left':'right', def=att==='left'?'right':'left';
    spawnHit(def);
    if(def==='left'){hpL=Math.max(0,hpL-1);document.getElementById('hp-left').textContent=makeHp(hpL);}
    else{hpR=Math.max(0,hpR-1);document.getElementById('hp-right').textContent=makeHp(hpR);}
    if(hpL<=0||hpR<=0){
      document.getElementById('vs-text').textContent=hpL<=0?'🐶 MENANG!':'🐱 MENANG!';
      setTimeout(()=>{hpL=3;hpR=3;document.getElementById('hp-left').textContent=makeHp(hpL);document.getElementById('hp-right').textContent=makeHp(hpR);document.getElementById('vs-text').textContent='⚔️ VS ⚔️';},1500);
    }
  },800+Math.random()*400);
}
function startChaos(){
  chaosIntervals.push(setInterval(spawnFrog,1200));
  chaosIntervals.push(setInterval(spawnStar,400));
  startFight();
}
function stopChaos(){
  chaosIntervals.forEach(clearInterval);chaosIntervals=[];
  frogIntervals.forEach(clearInterval);frogIntervals=[];
  clearInterval(fightInterval);
  chaos.innerHTML='';
  document.getElementById('fighters').style.display='none';
}

let carIdx = 0;
function setup(){
  document.getElementById('hb-sub-name').textContent = `🎉 Selamat Congratulations Birth Hari, Nailah! 🎉`;
  document.getElementById('msg-text').innerHTML = PESAN.replace(/\n/g,'<br>');
  document.getElementById('popup-name').textContent = NAMA;
  document.getElementById('popup-msg').innerHTML = '';
  // buat dots
  const dotsEl = document.getElementById('car-dots');
  dotsEl.innerHTML = '';
  FOTOS.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'car-dot' + (i===0 ? ' active' : '');
    d.onclick = () => carGo(i);
    dotsEl.appendChild(d);
  });
  carGo(0);
}
function carGo(i){
  carIdx = (i + FOTOS.length) % FOTOS.length;
  const src = FOTOS[carIdx].trim() || PLACEHOLDER;
  const img = document.getElementById('popup-photo');
  img.style.opacity = '0';
  setTimeout(() => { img.src = src; img.style.opacity = '1'; }, 150);
  document.querySelectorAll('.car-dot').forEach((d,j) => d.classList.toggle('active', j===carIdx));
}
function carMove(dir){ carGo(carIdx + dir); }

function openCard(){
  setup();
  document.getElementById('intro').style.display='none';
  document.getElementById('birthday').style.display='flex';
  active=true;
  for(let i=0;i<6;i++) setTimeout(()=>burst(120+Math.random()*(W-240),80+Math.random()*(H*.5)),i*180);
  launchRandom();
  startChaos();
}

function showPhoto(){
  document.getElementById('photo-overlay').classList.add('show');
  for(let i=0;i<5;i++) setTimeout(()=>burst(80+Math.random()*(W-160),80+Math.random()*(H*.45)),i*130);
}

function hidePhoto(e){
  if(!e || e.target===document.getElementById('photo-overlay'))
    document.getElementById('photo-overlay').classList.remove('show');
}

function restart(){
  active=false; particles=[]; ctx.clearRect(0,0,W,H);
  stopChaos();
  document.getElementById('birthday').style.display='none';
  document.getElementById('photo-overlay').classList.remove('show');
  const intro=document.getElementById('intro');
  intro.style.display='flex'; intro.style.animation='none';
  void intro.offsetWidth; intro.style.animation='fadeIn 0.6s ease';
}
</script>
